<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <title>soph.ia Knowledge Graph — product view</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#canvas)"/>
  <rect width="1200" height="760" fill="url(#glow)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="224" height="760" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="28" cy="30" r="10" fill="#2563eb"/>
  <text x="46" y="35" font-size="15" font-weight="700" fill="#0f172a">soph<span fill="#2563eb">.</span>ia</text>

  <g font-size="12" fill="#64748b">
    <text x="24" y="84" font-weight="600" letter-spacing="1.2">GRAPH</text>
    <g font-size="13.5" fill="#334155">
      <circle cx="24" cy="120" r="4" fill="#2563eb"/>
      <text x="36" y="125">Knowledge Graph</text>
      <circle cx="24" cy="156" r="4" fill="none" stroke="#cbd5e1"/>
      <text x="36" y="161" fill="#64748b">Editor</text>
      <circle cx="24" cy="192" r="4" fill="none" stroke="#cbd5e1"/>
      <text x="36" y="197" fill="#64748b">Review Center</text>
      <circle cx="24" cy="228" r="4" fill="none" stroke="#cbd5e1"/>
      <text x="36" y="233" fill="#64748b">Agents</text>
      <circle cx="24" cy="264" r="4" fill="none" stroke="#cbd5e1"/>
      <text x="36" y="269" fill="#64748b">People</text>
    </g>
  </g>

  <!-- Main header -->
  <rect x="224" y="0" width="976" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="252" y="40" font-size="17" font-weight="700" fill="#0f172a">Knowledge Graph</text>
  <g transform="translate(760 18)">
    <rect width="240" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14" y="19" font-size="12.5" fill="#94a3b8">Buscar nodos…</text>
  </g>
  <rect x="1032" y="16" width="78" height="32" rx="10" fill="#2563eb"/>
  <text x="1046" y="36" font-size="13" font-weight="600" fill="#ffffff">New KU</text>

  <!-- Canvas with dots -->
  <g fill="#e2e8f0">
    <circle cx="260" cy="100" r="1.2"/><circle cx="350" cy="180" r="1.2"/><circle cx="420" cy="90" r="1.2"/>
    <circle cx="520" cy="140" r="1.2"/><circle cx="600" cy="220" r="1.2"/><circle cx="700" cy="120" r="1.2"/>
    <circle cx="800" cy="180" r="1.2"/><circle cx="900" cy="110" r="1.2"/><circle cx="980" cy="160" r="1.2"/>
    <circle cx="1060" cy="130" r="1.2"/><circle cx="300" cy="320" r="1.2"/><circle cx="450" cy="360" r="1.2"/>
    <circle cx="560" cy="300" r="1.2"/><circle cx="680" cy="380" r="1.2"/><circle cx="820" cy="320" r="1.2"/>
    <circle cx="940" cy="400" r="1.2"/><circle cx="280" cy="480" r="1.2"/><circle cx="420" cy="520" r="1.2"/>
    <circle cx="640" cy="480" r="1.2"/><circle cx="760" cy="540" r="1.2"/><circle cx="900" cy="500" r="1.2"/>
    <circle cx="1040" cy="560" r="1.2"/><circle cx="360" cy="640" r="1.2"/><circle cx="820" cy="660" r="1.2"/>
  </g>

  <!-- Edges -->
  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="620" y1="360" x2="420" y2="190"/>
    <line x1="620" y1="360" x2="770" y2="220"/>
    <line x1="620" y1="360" x2="500" y2="500"/>
    <line x1="620" y1="360" x2="830" y2="470"/>
    <line x1="420" y1="190" x2="770" y2="220"/>
    <line x1="500" y1="500" x2="830" y2="470"/>
  </g>

  <!-- Nodes -->
  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="540" y="320" width="160" height="80" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="566" cy="360" r="11" fill="#eff6ff" stroke="#2563eb"/>
    <path d="M561 360 h10 M566 355 v10" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
    <text x="584" y="357" font-size="13.5" font-weight="600" fill="#0f172a">Knowledge Core</text>
    <text x="584" y="376" font-size="11.5" fill="#94a3b8">Marketing · 24 nodes</text>
  </g>

  <!-- Policy KU (verified) -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="140" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="374" cy="188" r="9" fill="#ecfdf5" stroke="#059669"/>
    <path d="M369 188 l4 4 l7 -8" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="390" y="184" font-size="13" font-weight="600" fill="#0f172a">Policy KU</text>
    <text x="390" y="202" font-size="11" fill="#059669">● verified · v3</text>
  </g>

  <!-- Dataset (pending) -->
  <g filter="url(#shadow)">
    <rect x="700" y="180" width="140" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="724" cy="218" r="9" fill="#fffbeb" stroke="#d97706"/>
    <circle cx="721" cy="218" r="3.4" fill="#d97706"/><circle cx="727" cy="218" r="3.4" fill="#d97706"/>
    <text x="740" y="214" font-size="13" font-weight="600" fill="#0f172a">Dataset</text>
    <text x="740" y="232" font-size="11" fill="#d97706">● pending · v1</text>
  </g>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="420" y="460" width="150" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="444" cy="498" r="9" fill="#eff6ff" stroke="#2563eb"/>
    <path d="M440 500 l4 -6 3 5 3 -3" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="460" y="494" font-size="13" font-weight="600" fill="#0f172a">Agent</text>
    <text x="460" y="512" font-size="11" fill="#64748b">Support · live</text>
  </g>

  <!-- Review -->
  <g filter="url(#shadow)">
    <rect x="750" y="430" width="150" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="774" cy="468" r="9" fill="#ecfdf5" stroke="#059669"/>
    <path d="M770 467 l3 3 l5 -5 M774 471 v3" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="790" y="464" font-size="13" font-weight="600" fill="#0f172a">Review</text>
    <text x="790" y="482" font-size="11" fill="#059669">3 pending</text>
  </g>

  <!-- Legend -->
  <g transform="translate(964 300)" font-size="11.5" fill="#64748b">
    <rect width="176" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" font-weight="600" fill="#0f172a">Estado</text>
    <circle cx="24" cy="48" r="4" fill="#059669"/><text x="36" y="52">Verificado</text>
    <circle cx="24" cy="72" r="4" fill="#d97706"/><text x="36" y="76">Pendiente</text>
    <circle cx="24" cy="96" r="4" fill="#dc2626"/><text x="36" y="100">Requiere revisión</text>
  </g>
</svg>
